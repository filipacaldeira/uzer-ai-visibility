[build]
  base       = "."
  publish    = "dist"
  command    = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# /api-proxy/* is handled by the edge function in netlify/edge-functions/
# api-proxy.ts, which injects the API key server-side (PEEKABOO_API_KEY env).

# SPA fallback: every other route falls back to index.html so React Router
# can render the correct page on a hard-refresh or direct link.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
